<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Gallery</title>
    <link rel="preconnect" href="https://zigguratss.com" crossorigin>
    <link rel="dns-prefetch" href="https://zigguratss.com">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        background: #1c1917;
      }

      /* Premium top progress line (intentional, fast, no blocking overlay) */
      #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 1px;
        z-index: 9999;
        pointer-events: none;
        opacity: 1;
        transition: opacity 220ms ease;
      }

      #loader::before {
        content: '';
        position: absolute;
        inset: 0;
        transform: scaleX(0);
        transform-origin: 0% 50%;
        will-change: transform;
        background: linear-gradient(90deg, rgba(245, 245, 244, 0), rgba(245, 245, 244, 0.55), rgba(120, 113, 108, 0.9));
        filter: drop-shadow(0 0 6px rgba(245, 245, 244, 0.18));
      }

      #loader.is-animating::before {
        animation: progressDraw 720ms cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }

      #loader::after {
        content: '';
        position: absolute;
        top: -2px;
        left: 0;
        width: 100%;
        height: 5px;
        opacity: 0;
        background: radial-gradient(closest-side, rgba(245, 245, 244, 0.18), rgba(245, 245, 244, 0));
        transform: scaleX(0);
        transform-origin: 0% 50%;
        will-change: transform, opacity;
      }

      #loader.is-animating::after {
        opacity: 1;
        animation: progressGlow 720ms cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }

      #loader.done {
        opacity: 0;
      }

      @keyframes progressDraw {
        0% { transform: scaleX(0); }
        60% { transform: scaleX(0.78); }
        100% { transform: scaleX(1); }
      }

      @keyframes progressGlow {
        0% { transform: scaleX(0); }
        60% { transform: scaleX(0.78); }
        100% { transform: scaleX(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        #loader, #loader::before, #loader::after {
          animation: none !important;
          transition: none !important;
        }
      }
      
      #root {
        height: 100%;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-rUZvL1y8.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CKda3eIZ.css">
  </head>
  <body>
    <div id="loader" aria-hidden="true"></div>
    <div id="root"></div>
    
    <script>
      // Intentional page-open transition (fast, non-blocking)
      (function () {
        const loader = document.getElementById('loader');
        if (!loader) return;

        // Start as soon as possible (doesn't wait for network)
        requestAnimationFrame(() => loader.classList.add('is-animating'));

        // End quickly; content is never covered
        const totalMs = 740;
        window.addEventListener('load', function () {
          setTimeout(function () {
            loader.classList.add('done');
            setTimeout(function () {
              loader.remove();
            }, 260);
          }, Math.max(0, totalMs - 120));
        });
      })();
    </script>
  </body>
</html>
